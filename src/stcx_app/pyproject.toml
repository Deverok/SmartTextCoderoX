[project]
name = "STCX-app"
version = "0.0.0"
description = "CLI and orchestration entrypoints for SmartTextCoderoX"
requires-python = ">=3.10"
dependencies = [
  "STCX-core",
  "STCX-steps",
  "STCX-agents",
  "STCX-analytics",
  "STCX-viz",
  "STCX-reporting",
]

[project.scripts]
stcx-step = "stcx_app.cli_step:main"
stcx-tool = "stcx_app.cli_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stcx_app"]
