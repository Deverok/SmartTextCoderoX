[project]
name = "STCX-contracts"
version = "0.0.0"
description = "Schemas, validators, error codes for SmartTextCoderoX"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stcx_contracts"]
