[project]
name = "STCX-core"
version = "0.0.0"
description = "Config, workspace, logging, manifest for SmartTextCoderoX"
requires-python = ">=3.10"
dependencies = [
  "STCX-contracts",
  "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stcx_core"]
