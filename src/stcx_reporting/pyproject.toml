[project]
name = "STCX-reporting"
version = "0.0.0"
description = "Report assembly for SmartTextCoderoX (stub in MS0)"
requires-python = ">=3.10"
dependencies = [
  "STCX-core",
  "STCX-analytics",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stcx_reporting"]
