[project]
name = "smarttextcoderox"
version = "0.0.0"
description = "Offline-first text content analysis pipeline (SmartTextCoderoX)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SmartTextCoderoX contributors" }]
dependencies = [
  "STCX-app",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
  "jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "src/stcx_contracts",
  "src/stcx_core",
  "src/stcx_steps",
  "src/stcx_agents",
  "src/stcx_analytics",
  "src/stcx_viz",
  "src/stcx_reporting",
  "src/stcx_app",
]

[tool.uv.sources]
STCX-contracts = { workspace = true }
STCX-core = { workspace = true }
STCX-steps = { workspace = true }
STCX-agents = { workspace = true }
STCX-analytics = { workspace = true }
STCX-viz = { workspace = true }
STCX-reporting = { workspace = true }
STCX-app = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["src", "tests"]
pythonpath = ["src"]
markers = [
  "integration: offline integration tests (no network)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = [
  "stcx_contracts",
  "stcx_core",
  "stcx_steps",
  "stcx_agents",
  "stcx_analytics",
  "stcx_viz",
  "stcx_reporting",
  "stcx_app",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "script"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["src"]
branch = true
