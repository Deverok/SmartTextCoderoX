name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  quality:
    # Pin image: avoid ubuntu-latest → Ubuntu 26 migration (2026-10-19).
    # Note: jobs will not start if the GitHub account is billing-locked.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Unit + integration (offline)
        run: |
          uv run pytest -q
          uv run pytest -m integration -q
      - name: License check
        run: uv run python script/ci/license_check.py
      - name: Verify workspace
        run: uv run python script/maintenance/verify_workspace.py
